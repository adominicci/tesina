name: Local inference fake boundary

on:
  pull_request:
    paths:
      - ".github/workflows/local-ai-boundary.yml"
      - "scripts/*local-ai-proof*"
      - "apps/desktop/src/lib/local-ai/**"
      - "apps/desktop/src/lib/autofill/client.ts"
      - "apps/desktop/src/lib/autofill/nativeTransport.test.ts"
      - "apps/desktop/src/lib/state/updater.svelte*"
      - "apps/desktop/src/lib/components/AppLayout.svelte"
      - "apps/desktop/src-tauri/src/local_ai/**"
      - "apps/desktop/src-tauri/src/reference_fetch*"
      - "apps/desktop/src-tauri/src/reference_fetch/**"
      - "apps/desktop/src-tauri/examples/local-ai-*"
      - "apps/desktop/src-tauri/src/lib.rs"
      - "apps/desktop/src-tauri/build.rs"
      - "apps/desktop/src-tauri/Cargo.*"
      - "apps/desktop/src-tauri/tauri.conf.json"
      - "apps/desktop/src-tauri/capabilities/default.json"
      - "apps/desktop/package.json"
      - "deno.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install locked application dependencies
        run: deno install --frozen
      - name: Check frontend contracts
        run: deno task check
      - name: Focused client and proof contracts
        run: deno task test apps/desktop/src/lib/local-ai apps/desktop/src/lib/autofill/nativeTransport.test.ts scripts/local-ai-proof-result.test.ts scripts/local-ai-proof-workflow.test.ts
      - name: Native boundary tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --lib local_ai
      - name: Native reference tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --lib reference_fetch
      - name: Actual platform webview and separate fake process
        env:
          TESINA_PROOF_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: deno run -A scripts/run-local-ai-proof.ts
