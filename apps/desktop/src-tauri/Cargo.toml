[package]
name = "tesina"
version = "0.1.25"
description = "Tesina: APA 7 academic writing app"
authors = ["Andres Dominicci and Tesina contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tesina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
# Locked MIT OR Apache-2.0 SDK shim compiler; no upstream runtime build.
cc = "=1.2.67"

[features]
native-proof-host = []
packaged-backup-smoke = ["packaged-portable-smoke"]
packaged-portable-smoke = []
packaged-spelling-proof = []
pdf-proof-host = []
spelling-proof-host = []
spelling-ipc-test = ["tauri/test"]
local-ai-proof = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
same-file = "=1.0.6"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-single-instance = "2.4.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "net", "io-util", "process"] }
hyper = { version = "=1.10.1", features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http-body-util = "=0.1.3"
bytes = "=1.12.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.41", default-features = false, features = ["ring"] }
flate2 = "=1.1.9"
url = "=2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
# Cocoa printing for the silent PDF export. These exact versions already arrive
# through the locked Wry graph, so nothing new enters the dependency tree, and
# all are `Zlib OR Apache-2.0 OR MIT`.
libc = "0.2"
# Full Unicode case folding and canonical normalization for macOS filename quota
# keys (both MIT OR Apache-2.0).
unicode-casefold = "0.2.0"
unicode-normalization = "0.1.25"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = [
  "NSGraphics",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSSpellChecker",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "=0.3.2", features = [
  "NSArray",
  "NSDictionary",
  "NSGeometry",
  "NSString",
  "NSURL",
] }
objc2-web-kit = { version = "=0.3.2", features = ["WKWebView"] }

[target.'cfg(windows)'.dependencies]
# WebView2 printing for the silent PDF export. Both exact versions already
# arrive through the locked Tauri/Wry graph, so nothing new enters the
# dependency tree, and both are `MIT OR Apache-2.0`.
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_Security",
  "Win32_System_Pipes",
  "Win32_System_IO",
] }

[target.'cfg(unix)'.dependencies]
# Single-syscall no-replace rename for publishing dialog-related siblings.
# rustix already ships in the locked Tauri updater graph (Apache-2.0 OR MIT).
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tokio = { version = "=1.52.3", features = ["test-util"] }
tempfile = "3"
# Test-only native WebView2 host. These exact versions already back the locked
# Tauri runtime; keeping them as dev dependencies excludes the host from app
# bundles while allowing the example to use the same Tao/Wry stack directly.
# The host shares the pinned production url parser above.
tao = "=0.35.3"
wry = "=0.55.1"

[target.'cfg(windows)'.dev-dependencies]
# Test-only OS input for the visible WebView2 proof. This exact version is
# already locked through the Tauri/Wry graph and is MIT OR Apache-2.0.
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[[example]]
name = "local-ai-webview-proof"
path = "examples/local-ai-webview-proof.rs"
required-features = ["local-ai-proof"]

[[example]]
name = "local-ai-native-proof"
path = "examples/local-ai-native-proof.rs"
required-features = ["local-ai-proof"]

[[example]]
name = "local-ai-fake"
path = "examples/local-ai-fake.rs"
required-features = ["local-ai-proof"]

[[example]]
name = "webview2-proof-host"
path = "examples/webview2-proof-host.rs"
required-features = ["native-proof-host"]

[[example]]
name = "macos-pdf-proof-host"
path = "examples/macos-pdf-proof-host.rs"
required-features = ["pdf-proof-host"]

[[example]]
name = "pdf-export-live-proof"
path = "examples/pdf-export-live-proof.rs"
required-features = ["pdf-proof-host"]

[[example]]
name = "spelling-proof"
path = "examples/spelling-proof.rs"
required-features = ["spelling-proof-host"]

[[example]]
name = "spelling-ipc-test"
path = "examples/spelling-ipc-test.rs"
required-features = ["spelling-ipc-test"]
